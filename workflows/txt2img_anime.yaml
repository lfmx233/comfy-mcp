name: txt2img_anime
description: >-
  动漫风格文生图（SD1.5 底模 + BArtstyle LoRA）。当需求是「凭空画一张二次元插画」、
  没有参考图、且要快（512 级，笔记本显卡也能跑）时用这个。改 prompt 换内容，
  改 width/height 换构图比例，改 seed 换构图变体。
tags: [image, anime, txt2img]
workflow: txt2img_anime.json
params:
  prompt:
    type: string
    required: true
    max_len: 800
    path: "5.inputs.text"
    description: 正向提示词，英文逗号分隔的 danbooru 风格 tag 最稳定。
  negative:
    type: string
    default: >-
      ((nsfw)),sketches,tattoo,(beard:1.3),(EasyNegative:1.3),badhandv4,(Teeth:1.3),
      (worst quality:2),(low quality:2),(normal quality:2),lowres,normal quality,
      jpeg artifacts,signature,watermark,username,blurry
    max_len: 800
    path: "4.inputs.text"
    description: 反向提示词，默认沿用模板里那套去瑕疵 tag，一般不用改。
  seed:
    type: integer
    default: -1
    minimum: 0
    maximum: 4294967295
    path: "6.inputs.seed"
    description: 随机种子；-1 表示由服务器随机挑一个，结果里会回填真实值。
  steps:
    type: integer
    default: 30
    minimum: 1
    maximum: 150
    path: "6.inputs.steps"
    description: 采样步数。20 够草稿，30 是常用值，超过 50 收益很小但耗时线性上涨。
  cfg:
    type: float
    default: 7.0
    minimum: 1.0
    maximum: 30.0
    path: "6.inputs.cfg"
    description: 提示词贴合强度。4~7 自然，8~12 更"听话"但容易过饱和。
  width:
    type: integer
    default: 512
    enum: [512, 640, 768, 896, 1024]
    path: "7.inputs.width"
    description: 输出宽度（像素）。SD1.5 在 512~768 最稳，1024 可能出现双头。
  height:
    type: integer
    default: 512
    enum: [512, 640, 768, 896, 1024]
    path: "7.inputs.height"
    description: 输出高度（像素），同上。
  batch_size:
    type: integer
    default: 1
    minimum: 1
    maximum: 4
    path: "7.inputs.batch_size"
    description: 一次出几张。>1 会把结果作为多张图一起返回，显存压力同步上升。
  ckpt_name:
    type: string
    default: anything-v5-PrtRE.safetensors
    path: "1.inputs.ckpt_name"
    description: 底模文件名，必须已装在目标实例上；不确定就先用默认值。
  lora_name:
    type: string
    default: BArtstyleV7-EXP.safetensors
    path: "2.inputs.lora_name"
    description: 风格 LoRA 文件名；实例上不存在时会报 MODEL_MISSING。
  lora_strength:
    type: float
    default: 0.8
    minimum: 0.0
    maximum: 2.0
    paths: ["2.inputs.strength_model", "2.inputs.strength_clip"]
    description: LoRA 权重。0.6~0.9 通常最自然，1.2 以上容易"画风崩"。
